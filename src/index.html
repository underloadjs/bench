<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f5f6f8" />
        <meta name="description" content="Bench — model benchmarking dashboard" />
        <title>Bench</title>
        <style>
            /* Paint the page in the dashboard background before React mounts so
               first paint matches (light surface) and avoids a white flash. */
            html, body, #root { height: 100%; margin: 0; }
            body {
                background-color: #f5f6f8;
                color: #111827;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
            }
            *::-webkit-scrollbar { width: 10px; height: 10px; }
            *::-webkit-scrollbar-track { background: transparent; }
            *::-webkit-scrollbar-thumb {
                background: rgba(16, 24, 40, 0.12);
                border: 2px solid transparent;
                border-radius: 8px;
                background-clip: padding-box;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <!-- Entry is relative (./main.tsx) so the build resolves it both with
             root=src and when index.html sits at the package root. -->
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
