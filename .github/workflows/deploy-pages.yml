# Deploys the bench dashboard to GitHub Pages.
#
# Pages serves the site under https://<owner>.github.io/<repo-name>/, so the
# build passes a matching Vite base path (--base=/<repo-name>/) — asset URLs
# must resolve from the subpath, never the domain root.
#
# The build is self-contained: @presource/core and @presource/react resolve
# from the public npm registry, and @config/environment (a private monorepo
# package that is NOT published) aliases to the vendored
# local/config/environment.ts shim when the monorepo checkout is not present.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".

name: Deploy bench dashboard to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        # Pinned while ubuntu-latest migrates to Ubuntu 26 (runner-images #14748).
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build dashboard
              run: yarn build --base=/${{ github.event.repository.name }}/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
